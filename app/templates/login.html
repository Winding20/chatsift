<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>chatsift · 登录</title>
<link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
<style>
body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font-family: -apple-system, "Microsoft YaHei", sans-serif;
    background: radial-gradient(ellipse at 20% 10%, #f2f7ff, transparent 50%),
                radial-gradient(ellipse at 80% 90%, #f4f2ff, transparent 50%), #f7f9ff;
    color: #2f3040;
}
.card {
    background: #fff; border-radius: 18px; padding: 28px 30px;
    box-shadow: 0 20px 50px rgba(60, 80, 140, .12); width: min(340px, 86vw);
}
h1 { font-size: 17px; margin: 0 0 6px; }
p { font-size: 12px; color: #75788f; margin: 0 0 18px; }
input {
    width: 100%; box-sizing: border-box; font: inherit; font-size: 14px;
    padding: 10px 12px; border-radius: 10px; border: 1px solid #e2e7f2;
}
input:focus { outline: 2px solid rgba(79,139,255,.2); border-color: #4f8bff; }
button {
    width: 100%; margin-top: 12px; font: inherit; font-size: 14px; font-weight: 600;
    padding: 10px; border: 0; border-radius: 10px; color: #fff;
    background: #4f8bff; cursor: pointer;
}
button:hover { background: #3f7af0; }
.err { color: #d0453c; font-size: 12px; margin-top: 10px; }
</style>
</head>
<body>
<form class="card" method="post">
    <h1>chatsift</h1>
    <p>这个面板设了访问密码</p>
    <input type="password" name="password" placeholder="输入密码" autofocus autocomplete="current-password">
    <button type="submit">进入</button>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
</form>
</body>
</html>
